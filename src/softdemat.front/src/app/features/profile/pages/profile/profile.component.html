<section class="mx-auto max-w-lg">
  <form class="ui-card space-y-4 p-6" [formGroup]="form" (ngSubmit)="submit()">
    <p class="ui-kicker">Profil</p>
    <h1 class="ui-title">Mot de passe</h1>
    @if (mustChange()) {
      <p class="rounded-lg bg-accent/15 px-3 py-2 text-sm text-accent">Vous devez changer votre mot de passe avant de continuer.</p>
    }
    <div>
      <label class="ui-label" for="current">Ancien mot de passe</label>
      <input id="current" type="password" class="ui-field" formControlName="currentPassword" />
    </div>
    <div>
      <label class="ui-label" for="next">Nouveau mot de passe</label>
      <input id="next" type="password" class="ui-field" formControlName="newPassword" />
    </div>
    <div>
      <label class="ui-label" for="confirm">Confirmation</label>
      <input id="confirm" type="password" class="ui-field" formControlName="confirmation" />
      <app-field-error [message]="confirmationError()" />
    </div>
    <div class="flex justify-end">
      <button type="submit" class="ui-btn">Enregistrer</button>
    </div>
  </form>
</section>
