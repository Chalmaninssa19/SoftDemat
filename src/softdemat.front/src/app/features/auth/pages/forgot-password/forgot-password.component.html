<main class="login-stage flex min-h-screen items-center justify-center px-4 py-8 text-white">
  <form class="login-card w-full max-w-md rounded-2xl p-8 shadow-2xl" [formGroup]="form" (ngSubmit)="submit()">
    <p class="text-sm font-semibold">SOFT-DEMAT</p>
    <h1 class="mt-6 text-2xl font-semibold">Mot de passe oublié ?</h1>
    <p class="mt-2 text-sm opacity-70">Saisissez l'adresse e-mail associée à votre compte. Si elle est reconnue, vous recevrez un lien de réinitialisation.</p>
    <label class="mt-6 block text-sm font-medium" for="email">Adresse e-mail</label>
    <input id="email" class="login-field mt-1 w-full rounded-lg px-3 py-2 outline-none" type="email" formControlName="email" autocomplete="email" />
    <app-field-error [message]="fieldError()" colorClass="text-red-500" />
    @if (successMessage()) {
      <p class="mt-4 text-sm text-green-300" role="status">{{ successMessage() }}</p>
    }
    @if (errorMessage()) {
      <p class="mt-4 text-sm text-red-400" role="alert">{{ errorMessage() }}</p>
    }
    <button type="submit" class="mt-6 flex w-full items-center justify-center rounded-lg bg-navy px-4 py-3 font-medium text-white disabled:opacity-60" [disabled]="submitting()">
      {{ submitting() ? 'Envoi…' : 'Envoyer le lien' }}
    </button>
    <p class="mt-5 text-center text-sm"><a class="text-accent underline-offset-4 hover:underline" routerLink="/auth/connexion">Retour à la connexion</a></p>
  </form>
</main>
