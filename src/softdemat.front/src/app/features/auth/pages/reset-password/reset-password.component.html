<main class="login-stage flex min-h-screen items-center justify-center px-4 py-8 text-white">
  <form class="login-card w-full max-w-md rounded-2xl p-8 shadow-2xl" [formGroup]="form" (ngSubmit)="submit()">
    <p class="text-sm font-semibold">SOFT-DEMAT</p>
    <h1 class="mt-6 text-2xl font-semibold">Choisir un nouveau mot de passe</h1>
    @if (success()) {
      <p class="mt-4 text-sm text-green-300" role="status">Votre mot de passe a été modifié.</p>
      <p class="mt-5 text-center text-sm"><a class="text-accent underline-offset-4 hover:underline" routerLink="/auth/connexion">Retour à la connexion</a></p>
    } @else {
      <label class="mt-6 block text-sm font-medium" for="new-password">Nouveau mot de passe</label>
      <input id="new-password" class="login-field mt-1 w-full rounded-lg px-3 py-2 outline-none" type="password" formControlName="newPassword" autocomplete="new-password" />
      <app-field-error [message]="fieldError('newPassword')" colorClass="text-red-500" />
      <label class="mt-4 block text-sm font-medium" for="confirmation">Confirmer le mot de passe</label>
      <input id="confirmation" class="login-field mt-1 w-full rounded-lg px-3 py-2 outline-none" type="password" formControlName="confirmation" autocomplete="new-password" />
      <app-field-error [message]="fieldError('confirmation')" colorClass="text-red-500" />
      @if (passwordsDiffer()) {
        <p class="mt-1 text-sm text-red-500">Vérifiez la confirmation du mot de passe.</p>
      }
      @if (errorMessage()) {
        <p class="mt-4 text-sm text-red-400" role="alert">{{ errorMessage() }}</p>
      }
      <button type="submit" class="mt-6 flex w-full items-center justify-center rounded-lg bg-navy px-4 py-3 font-medium text-white disabled:opacity-60" [disabled]="submitting()">
        {{ submitting() ? 'Enregistrement…' : 'Modifier le mot de passe' }}
      </button>
      <p class="mt-5 text-center text-sm"><a class="text-accent underline-offset-4 hover:underline" routerLink="/auth/connexion">Retour à la connexion</a></p>
    }
  </form>
</main>
