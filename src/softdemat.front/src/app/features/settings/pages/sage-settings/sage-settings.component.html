<section class="mx-auto max-w-xl">
  <form class="ui-card space-y-4 p-6" [formGroup]="form" (ngSubmit)="save()">
    <p class="ui-kicker">Paramétrage</p>
    <h1 class="ui-title">Connexion Sage</h1>
    <a routerLink="/parametrage/envoi" class="text-sm text-accent">Envoi et archivage</a>
    <p class="text-sm text-muted">Le mot de passe n'est jamais réaffiché. Laissez-le vide pour conserver celui déjà enregistré.</p>
    <div>
      <label class="ui-label" for="server">Serveur</label>
      <input id="server" class="ui-field" formControlName="server" />
    </div>
    <div>
      <label class="ui-label" for="database">Base</label>
      <input id="database" class="ui-field" formControlName="databaseName" />
    </div>
    <label class="flex items-center gap-2 text-sm">
      <input type="checkbox" formControlName="windowsAuthentication" />
      Authentification Windows
    </label>
    <div>
      <label class="ui-label" for="login">Identifiant SQL</label>
      <input id="login" class="ui-field" formControlName="login" />
    </div>
    <div>
      <label class="ui-label" for="sage-password">Mot de passe SQL</label>
      <input id="sage-password" type="password" class="ui-field" formControlName="password" autocomplete="new-password" />
    </div>
    <div class="flex justify-end gap-3">
      <button type="button" class="ui-btn-ghost" (click)="test()">Tester</button>
      <button type="submit" class="ui-btn">Enregistrer</button>
    </div>
  </form>
</section>
