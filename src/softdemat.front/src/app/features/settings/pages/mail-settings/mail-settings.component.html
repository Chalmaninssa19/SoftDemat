<section class="grid gap-6 lg:grid-cols-2">
  <form class="ui-card space-y-4 p-6" [formGroup]="general" (ngSubmit)="saveGeneral()">
    <p class="ui-kicker">Envoi</p>
    <h1 class="ui-title">Archivage</h1>
    <div>
      <label class="ui-label" for="archive">Dossier d'archive</label>
      <input id="archive" class="ui-field" formControlName="archiveFolder" />
    </div>
    <div>
      <label class="ui-label" for="cc">Copie (Cc)</label>
      <input id="cc" class="ui-field" formControlName="cc" />
    </div>
    <div class="flex justify-end">
      <button type="submit" class="ui-btn">Enregistrer</button>
    </div>
  </form>
  <form class="ui-card space-y-4 p-6" [formGroup]="mail" (ngSubmit)="saveMail()">
    <p class="ui-kicker">Envoi</p>
    <h2 class="ui-title">Modèle de mail</h2>
    <div>
      <label class="ui-label" for="type">Type existant</label>
      <select id="type" class="ui-field" [value]="mail.controls.id.value" (change)="select(+$any($event.target).value)">
        @for (template of templates(); track template.id) {
          <option [value]="template.id">{{ template.mailType }}</option>
        }
      </select>
    </div>
    <p class="text-xs text-muted">Balises : MM, AA, PNOM, NOM, MAT. Les retours à la ligne deviennent des sauts HTML.</p>
    <div>
      <label class="ui-label" for="object">Objet</label>
      <input id="object" class="ui-field" formControlName="mailObject" />
    </div>
    <div>
      <label class="ui-label" for="content">Contenu</label>
      <textarea id="content" rows="8" class="ui-field" formControlName="mailContent"></textarea>
    </div>
    <div class="flex justify-end">
      <button type="submit" class="ui-btn">Enregistrer le modèle</button>
    </div>
  </form>
</section>
