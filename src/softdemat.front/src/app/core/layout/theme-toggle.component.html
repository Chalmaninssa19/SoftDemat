<button
  type="button"
  class="inline-flex h-9 w-9 items-center justify-center rounded-full border transition-colors"
  [class.border-white/20]="tone() === 'hero'"
  [class.bg-white/10]="tone() === 'hero'"
  [class.text-white]="tone() === 'hero'"
  [class.border-line]="tone() === 'bar'"
  [class.bg-panel]="tone() === 'bar'"
  [class.text-content]="tone() === 'bar'"
  [attr.aria-label]="theme.mode() === 'dark' ? 'Activer le mode clair' : 'Activer le mode sombre'"
  [title]="theme.mode() === 'dark' ? 'Mode clair' : 'Mode sombre'"
  (click)="theme.toggle()"
>
  @if (theme.mode() === 'dark') {
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
    </svg>
  } @else {
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path>
    </svg>
  }
</button>
