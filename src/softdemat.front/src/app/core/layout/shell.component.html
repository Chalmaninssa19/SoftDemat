<div class="app-shell flex min-h-screen bg-ink text-content">
  @if (menuOpen()) {
    <button type="button" class="fixed inset-0 z-30 bg-black/50 md:hidden" aria-label="Fermer le menu" (click)="closeMenu()"></button>
  }
  <aside
    class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-line bg-sidebar transition-transform md:static md:translate-x-0"
    [class.-translate-x-full]="!menuOpen()"
    [class.translate-x-0]="menuOpen()"
  >
    <div class="border-b border-line px-4 py-4">
      <p class="text-sm font-semibold">SOFT-DEMAT</p>
      <p class="text-xs text-muted">Softwell</p>
    </div>
    <p class="px-4 pt-5 text-xs font-semibold tracking-wide text-accent-deep uppercase">Gestion</p>
    <nav class="mt-2 flex flex-1 flex-col gap-1 px-3">
      <a routerLink="/dematerialisation" routerLinkActive="bg-panel !text-content" class="rounded-lg px-3 py-2 text-sm text-muted hover:bg-panel hover:text-content" (click)="closeMenu()">Dématérialisation</a>
      <a routerLink="/historique" routerLinkActive="bg-panel !text-content" class="rounded-lg px-3 py-2 text-sm text-muted hover:bg-panel hover:text-content" (click)="closeMenu()">Historique</a>
      @if (isAdmin()) {
        <a routerLink="/parametrage" routerLinkActive="bg-panel !text-content" class="rounded-lg px-3 py-2 text-sm text-muted hover:bg-panel hover:text-content" (click)="closeMenu()">Paramétrage</a>
        <a routerLink="/utilisateurs" routerLinkActive="bg-panel !text-content" class="rounded-lg px-3 py-2 text-sm text-muted hover:bg-panel hover:text-content" (click)="closeMenu()">Utilisateurs</a>
      }
      <a routerLink="/profil" routerLinkActive="bg-panel !text-content" class="rounded-lg px-3 py-2 text-sm text-muted hover:bg-panel hover:text-content" (click)="closeMenu()">Profil</a>
    </nav>
    <button type="button" class="m-3 rounded-lg px-3 py-2 text-left text-sm text-muted hover:bg-panel hover:text-content" (click)="logout()">Se déconnecter</button>
  </aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-14 items-center justify-between gap-3 border-b border-line px-4">
      <div class="flex items-center gap-3">
        <button type="button" class="rounded-md border border-line px-2 py-1 text-sm md:hidden" (click)="toggleMenu()" aria-label="Ouvrir le menu">Menu</button>
        <p class="truncate text-sm font-medium">{{ pageTitle() }}</p>
      </div>
      <div class="flex items-center gap-3">
        <app-theme-toggle />
        <a routerLink="/profil" class="flex items-center gap-2">
          <span class="text-right text-xs leading-4">
            <span class="block font-medium">{{ session()?.name }}</span>
            <span class="block text-muted">{{ session()?.sageDatabaseName || 'Base Sage non configurée' }}</span>
          </span>
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-accent text-xs font-semibold text-[#1a1403]">{{ initials() }}</span>
        </a>
      </div>
    </header>
    <main class="min-w-0 flex-1 p-4 md:p-6">
      <router-outlet />
    </main>
  </div>
</div>
